# Fonts
# font_family family="Hack Nerd Font Mono"
# font_family family="Liberation Mono"
font_family family="Cousine Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# # cursor trail
# cursor_trail 100
# cursor_trail_decay 0.01 0.4
# cursor_trail_start_threshold 20

# hide mouse on typing
mouse_hide_wait -3.0

# scrollback
scrollback_lines 99999

# copy on select
copy_on_select yes

# paste from clipboard
map ctrl+shift+v paste_from_clipboard

# tab bar
tab_bar_min_tabs 2
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_activity_symbol !
tab_title_template "{'# ' if layout_name == 'stack' else ''}{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title}"

# mod key bindings
kitty_mod Ctrl+Alt

# kitty config reload keybind
map kitty_mod+, load_config_file ~/.config/kitty/kitty.conf

# tab keybinds
map ctrl+b>t new_tab_with_cwd
map Alt+l next_tab
map Alt+h previous_tab
# map kitty_mod+t new_tab
# map kitty_mod+l next_tab
# map kitty_mod+h previous_tab
# map kitty_mod+H move_tab_backward
# map kitty_mod+L move_tab_forward

# allow for hsplits and vsplits
enabled_layouts splits,stack
# map kitty_mod+s launch --type=window --location=hsplit --cwd=current
# map kitty_mod+v launch --type=window --location=vsplit --cwd=current
map ctrl+b>s launch --type=window --location=hsplit --cwd=current
map ctrl+b>v launch --type=window --location=vsplit --cwd=current
map Alt+x close_window
# map ctrl+b>z toggle_layout stack # tmux-like toggle fullscreen of a pane
map ctrl+b>z combine : toggle_layout stack : scroll_prompt_to_bottom
# map ctrl+b>x close_window
# quick access terminal. see <https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/>
map kitty_mod+l launch --type=background kitten quick_access_terminal --config ~/.dotfiles/kitty/.config/kitty/quick_access_terminal.conf

# NOTE: issues getting this remain compatible with tmux-nvim navigation
# nvim tmux-like keybinds: https://github.com/MunsMan/kitty-navigator.nvim
allow_remote_control yes
listen_on unix:@mykitty
map ctrl+j kitten pass_keys.py neighboring_window bottom ctrl+j
map ctrl+k kitten pass_keys.py neighboring_window top    ctrl+k
map ctrl+h kitten pass_keys.py neighboring_window left   ctrl+h
map ctrl+l kitten pass_keys.py neighboring_window right  ctrl+l

# test for fzf popup
# map kitty_mod+p launch --type=overlay --cwd=current fzf --height=50% --border=rounded --margin=10%,15%
# map ctrl+b>f launch --type overlay --cwd=current fzf -m --color=border:#cba6f7,label:#cdd6f4 --preview 'bat --color=always {}' --reverse --heigh=80% --border=rounded --margin=10%,15% --walker-skip .git,node_modules,target | xargs -r ${EDITOR}
# example of how to call zsh aliases from kitty
# map ctrl+b>f launch /bin/zsh -i -c 'v'
# map kitty_mod+p launch --type=overlay --cwd=current /bin/zsh -i -c 'f'

# quickly open lab notes in overlay window
map Alt+n launch --type=overlay --cwd=current --title="LabNotes" /bin/zsh -i -c 'v ~/Dropbox/Monash/HydDB/notebook'
map Alt+m launch --type=window --location=vsplit --cwd=current --title="LabNotes" /bin/zsh -i -c 'v ~/Dropbox/Monash/HydDB/notebook'
map Alt+, launch --type=window --location=hsplit --cwd=current --title="LabNotes" /bin/zsh -i -c 'v ~/Dropbox/Monash/HydDB/notebook'
# quickly open reference notes
map Alt+i launch --type=overlay --cwd=current --title="RefNotes" /bin/zsh -i -c 'v ~/Documents/reference/RefNotes.md'
map Alt+o launch --type=window --location=vsplit --cwd=current --title="RefNotes" /bin/zsh -i -c 'v ~/Documents/reference/RefNotes.md'

# NOTE: features to add in the future:
# - fzf-tmux replacement
# - session manager
# - fuzzy search for session, tabs, windows
# - tmux copy/open URL functionality


