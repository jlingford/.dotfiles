# yazi.toml
[mgr]
show_hidden = true

[opener]
view-image = [
    { run = "nsxiv %s", desc = "Open in nsxiv", orphan = true, for = "unix" },
]
view-svg = [
    { run = "firefox %s", desc = "Open in firefox", orphan = true, for = "unix" },
]

[open]
prepend_rules = [
    { url = "*.png", use = "view-image" },
    { url = "*.jpg", use = "view-image" },
    { url = "*.svg", use = "view-svg" },

    # 	# Multiple openers for a single rule
    # 	{ url = "*.html", use = [ "open", "edit" ] },
    # ]
    # append_rules = [
    # 	{ url = "*", use = "my-fallback" },
]
